<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fehler – Outsidegame</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div class="Head">
            <div class="error-icon" aria-hidden="true">!</div>
            <h1 id="errorTitle">Etwas ist schiefgelaufen</h1>
        </div>
        <div id="errorStatus" class="error-status hidden"></div>
        <p class="error-text" id="errorMessage">
            Beim Verarbeiten deiner Anfrage ist ein Fehler aufgetreten.
            Bitte versuch es gleich noch einmal.
        </p>
        <div class="error-actions">
            <a class="button" href="/">Zurück zur Startseite</a>
        </div>
    </main>
    <script src="main.js"></script>
</body>
</html>
